<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective-Agency-Login Page</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">

</head>

<body>

    <section class="login-page">

        <div class="left-page">

            <div class="log-head">
                <h1>Login Here</h1>
                <p>Access your investigation dashboard securely.</p>
            </div>

            <div class="form">

                <div class="role-btns">
                    <button class="role-btn active" data-role="Admin">Admin</button>
                    <button class="role-btn" data-role="Client">Client</button>
                </div>

                <div class="form-box">
                    <div class="inputbox">
                        <span class="material-symbols-outlined">mail</span>
                        <input type="email" placeholder="Enter Your Email" id="log-email">
                    </div>
                    <p></p>
                </div>

                <div class="form-box">
                    <div class="password">
                        <span class="material-symbols-outlined">lock</span>
                        <input type="password" placeholder="Enter Your Password" id="log-pass">
                        <span class="material-symbols-outlined">visibility</span>
                    </div>
                    <p></p>
                </div>

                <a href="">forget Password?</a>

                <button class="log-btn">Submit</button>

            </div>

            <div class="log-foot">

                <p>Already Have an Account? <a href="">sign Up</a></p>

                <div class="or">
                    Or Continue With
                </div>

                <div class="log-icons">
                    <a href=""><i class="fa-brands fa-google"></i></a>
                    <a href=""><i class="fa-brands fa-apple"></i></a>
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                </div>

                 <a href="" class="home-btn"> <span class="material-symbols-outlined">home</span>Back to Home</a>
            </div>

        </div>

        <div class="right-page">
            <div class="logo-conatiner">
                <a href=""><img src="./src/logo.webp" alt="company logo"></a>
            </div>
        </div>

    </section>
</body>

</html>
